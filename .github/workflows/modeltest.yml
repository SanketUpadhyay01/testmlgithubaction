name: Simple ML Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v2

          - name: set up python
            uses: actions/setup-python@v2
            with:
                python-version: '3.9'

          - name: Install dependencies
            run: 
                python -m pip install --upgrade pip
                pip install -r requirements.txt

          - name: Run tests
            run: 
                python src/train.py

          - name: Save model
            uses: actions/upload-artifact@v2
            with:
                name: iris-model
                path: model.joblib
                retention-days: 5
